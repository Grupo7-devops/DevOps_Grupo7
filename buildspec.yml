version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Descargando Requerimientos"
      - pip install --upgrade pip
      - pip install -r requirements.txt
  build:
    on-failure: ABORT
    commands:
      - echo "Iniciando la ejecucción de pruebas unitarias"
      #- python -m pytest --junitxml=reports/pruebas.xml
      - echo "Pruebas superadas, se genera el artefacto"
  post_build:
    commands:
      - echo "Pruebas superadas, se prepara el artefacto"
      - mkdir -p dist
      - >
        tar --exclude='./dist' --exclude='./tests' --exclude='./reports'
        --exclude='./.git' --exclude='./venv' --exclude='./.venv'
        --exclude='__pycache__' --exclude='./buildspec.yml'
        -cf - . | tar -xf - -C dist

reports:
  unit-tests:
    files:
      - reports/pruebas.xml
    file-format: JUNITXML

artifacts:
  name: microservicio-flask
  base-directory: dist
  files:
    - '**/*'
